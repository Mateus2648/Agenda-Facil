name: Keep Supabase Awake

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "https://knmoluaxgnopqiatxbdr.supabase.co/auth/v1/health")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
            echo "Supabase is awake."
          else
            echo "Unexpected status: $STATUS"
            exit 1
          fi
